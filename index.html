<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>

<style>

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .container{
        width: 100vw;
        height: 100vh;
        background-color: hsl(47, 88%, 63%);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box{
        width: 370px;
        height: 500px;
        background-color: hsl(0, 0%, 100%);
        border: 0.1rem solid black;
        border-radius: 1.1em;
        padding: 1.2em;
        display: flex;
        flex-direction: column;
        box-shadow: 8px 8px 0px 0px black;
    }

    .image img{
        width: 100%;
        border-radius: 0.7em;
    }

    .learn{
        width: 5.5em;
        height: 1.6em;
        background-color: hsl(47, 88%, 63%);
        border-radius: 0.3em;
        margin-top: 0.5em;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .learn p{
        font-size: 1em;
        font-weight: bold;
    }
    p1{
        margin-top: 0.7em;
        font-size: 1em;
        font-weight: 400;
    }
    p2{
        font-weight: bolder;
        font-size: 1.5em;
        margin-top: 0.7em;
    }
    p3{
        margin-top: 0.7em;
        font-weight: 350;
    }
    .bioData{
        display: flex;
        align-items: center;
        margin-top: 1em;
    }
    .bioData img{
        width: 40px;
    }
    p4{
        font-size: 0.9em;
        font-weight: bolder;
        margin-left: 0.8em;
    }

    @media only screen and (max-width: 600px){
        .box{
            width: 300px;
            height: 500px;
        }
    }


</style>

</head>
<body>
    
    <div class="container">
        <div class="box">
            <div class="image">
                <img src="illustration-article.svg" alt="">
            </div>
            <div class="learn">
                <p>Learning</p>
            </div>
            
            <p1>Published 21 Dec 2023</p1>
            <p2>HTML & CSS Fondations</p2>
            <p3>These languages are the backbone of every website, defining structure, content, and presentation.</p3>
            <div class="bioData">
                <img src="image-avatar.webp" alt="">
                <p4>Greg Hopper</p4>
            </div>
        </div>
    </div>

</body>
</html>
